name: Build routing candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dedicated-public-routes
          fetch-depth: 0

      - name: Extract byte-safe routing transformer
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/build-routing-release.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply routing changes byte-safely\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Verify routing tests'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/apply-routing.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Apply routing changes
        run: python /tmp/apply-routing.py

      - name: Verify routing tests
        run: node --test tests/routes.test.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Production build
        run: npm run build

      - name: Publish clean candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-routing-release.yml .github/workflows/routing-artifact.yml
          git add app/rupantar/routes.ts app/rupantar/site.tsx app/rupantar/repository.ts tests/routes.test.mjs
          git checkout -B chatgpt/routing-release-candidate
          git commit -m "Add dedicated public routes"
          git push --force origin HEAD:chatgpt/routing-release-candidate
