name: Cleanup Targeted Fingerprint Helpers

on:
  push:
    branches:
      - fix/homepage-recent-connect

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary branch-only helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-targeted-fingerprints.yml
          rm -f .github/workflows/cleanup-targeted-fingerprints.yml
          git config user.name "rupantarhomes"
          git config user.email "rupantarhomes@gmail.com"
          git add -A .github/workflows
          git diff --cached --check
          git commit -m "chore: remove temporary fingerprint helpers [cleanup]"
          git push
