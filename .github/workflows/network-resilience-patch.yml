name: Temporary Network Resilience Patch

on:
  push:
    branches:
      - reliability/network-resilience-final

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: reliability/network-resilience-final
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic patch
        run: node scripts/apply-network-resilience.mjs

      - name: Verify production build and regressions
        run: npm run verify

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: harden public delivery on slow networks"
          git push origin HEAD:reliability/network-resilience-final
