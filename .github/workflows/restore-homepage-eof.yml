name: Restore homepage EOF

on:
  push:
    paths:
      - '.github/workflows/restore-homepage-eof.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact trailing blank line only
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/rupantar/home-page.tsx')
          b = p.read_bytes()
          if not b.endswith(b'}\n'):
              raise SystemExit('Unexpected EOF; refusing to edit')
          p.write_bytes(b + b'\r\n')
      - name: Verify only EOF changed
        run: |
          test "$(git diff --name-only)" = "app/rupantar/home-page.tsx"
          git diff --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rupantar/home-page.tsx
          git commit -m "Restore homepage trailing newline"
          git push origin HEAD:main
