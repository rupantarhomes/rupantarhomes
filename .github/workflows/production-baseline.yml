name: Production Baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Enforce production handover lock
        run: node scripts/verify-production-lock.mjs

      - name: Enforce UI-only production boundary
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'enhancement/premium-motion-') }}
        run: node scripts/check-ui-enhancement-diff.mjs "${{ github.event.pull_request.base.sha }}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Regression tests
        run: npm test
