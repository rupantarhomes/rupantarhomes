name: Form success inline-style release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'chatgpt/form-success-inline-style-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply byte-safe runtime styling fix
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_bytes().decode('utf-8')

          def write(path, text):
              Path(path).write_bytes(text.encode('utf-8'))

          def replace_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} replacement, got {count}')
              return updated

          site_path = 'app/rupantar/site.tsx'
          site = read(site_path)
          old = re.compile(
              r'      \{estimateSaved && typeof document !== "undefined" && createPortal\(\r?\n'
              r'        <div className="fixed inset-0 z-\[9999\] flex h-screen w-screen items-center justify-center bg-white/96 px-4 text-center backdrop-blur-sm" role="status" aria-live="polite" aria-atomic="true">\r?\n'
              r'          <div className="max-w-\[760px\] rounded-\[2rem\] border border-zinc-100 bg-white px-6 py-8 shadow-\[0_24px_80px_rgba\(0,0,0,0\.12\)\] sm:px-10 sm:py-10">\r?\n'
              r'            <p className="font-heading text-\[20px\] font-semibold leading-\[1\.45\] tracking-\[-0\.01em\] text-zinc-900 sm:text-\[24px\]">\r?\n'
              r'              Your form has been submitted\. Mr\. Gokul will connect with you in a few hours\.\r?\n'
              r'            </p>\r?\n'
              r'          </div>\r?\n'
              r'        </div>,\r?\n'
              r'        document\.body,\r?\n'
              r'      \)\}\r?\n'
          )
          replacement = '''      {estimateSaved && typeof document !== "undefined" && createPortal(\n        <div\n          role="status"\n          aria-live="polite"\n          aria-atomic="true"\n          style={{\n            position: "fixed",\n            inset: 0,\n            zIndex: 2147483647,\n            width: "100vw",\n            height: "100dvh",\n            display: "flex",\n            alignItems: "center",\n            justifyContent: "center",\n            boxSizing: "border-box",\n            padding: "16px",\n            textAlign: "center",\n            background: "rgba(255, 255, 255, 0.98)",\n            backdropFilter: "blur(6px)",\n            WebkitBackdropFilter: "blur(6px)",\n          }}\n        >\n          <div\n            style={{\n              width: "min(760px, 100%)",\n              boxSizing: "border-box",\n              borderRadius: "32px",\n              border: "1px solid #f4f4f5",\n              background: "#ffffff",\n              padding: "32px 24px",\n              boxShadow: "0 24px 80px rgba(0, 0, 0, 0.12)",\n            }}\n          >\n            <p\n              style={{\n                margin: 0,\n                fontFamily: '"Space Grotesk", sans-serif',\n                fontSize: "clamp(20px, 2vw, 24px)",\n                fontWeight: 600,\n                lineHeight: 1.45,\n                letterSpacing: "-0.01em",\n                color: "#18181b",\n              }}\n            >\n              Your form has been submitted. Mr. Gokul will connect with you in a few hours.\n            </p>\n          </div>\n        </div>,\n        document.body,\n      )}\n'''
          site = replace_once(site, old, replacement, 'portal overlay')
          write(site_path, site)

          test_path = 'tests/rendered-html.test.mjs'
          test = read(test_path)
          test = replace_once(
              test,
              r'  assert\.match\(site, /createPortal/\);\r?\n'
              r'  assert\.match\(site, /document\\\.body/\);\r?\n'
              r'  assert\.match\(site, /z-\\\[9999\\\]/\);\r?\n'
              r'  assert\.match\(site, /fixed inset-0/\);\r?\n'
              r'  assert\.doesNotMatch\(site, /z-50 flex h-screen w-screen items-center justify-center bg-white\\\/96/\);',
              '  assert.match(site, /createPortal/);\n'
              '  assert.match(site, /document\\.body/);\n'
              '  assert.match(site, /position: "fixed"/);\n'
              '  assert.match(site, /zIndex: 2147483647/);\n'
              '  assert.match(site, /height: "100dvh"/);\n'
              '  assert.doesNotMatch(site, /className="fixed inset-0/);',
              'success overlay assertions',
          )
          write(test_path, test)

      - name: Focused form-success regression test
        run: node --test --test-name-pattern "keeps secondary content flows validated and synchronized" tests/rendered-html.test.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Production build
        run: npm run build

      - name: Publish clean candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/form-success-inline-style-release.yml
          git add app/rupantar/site.tsx tests/rendered-html.test.mjs
          git checkout -B chatgpt/form-success-inline-style-candidate
          git commit -m "Make form success overlay independent of utility CSS"
          git push --force origin HEAD:chatgpt/form-success-inline-style-candidate
