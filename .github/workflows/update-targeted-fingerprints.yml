name: Refresh Targeted Production Fingerprints

on:
  push:
    branches:
      - fix/homepage-recent-connect

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[fingerprints]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh only changed production fingerprints
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const file = '.github/production-lock.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          manifest.objects.app = execFileSync('git', ['rev-parse', 'HEAD:app'], { encoding: 'utf8' }).trim();
          manifest.objects['index.html'] = execFileSync('git', ['rev-parse', 'HEAD:index.html'], { encoding: 'utf8' }).trim();
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');

          const baseline = 'docs/PRODUCTION-BASELINE.md';
          let text = fs.readFileSync(baseline, 'utf8');
          const heading = '## Accepted targeted homepage label/image update — 2026-08-30';
          if (!text.includes(heading)) {
            text += `\n\n${heading}\n\nScope is limited to the public homepage: the Recent Works heading is presented as lowercase white text in a rounded light-charcoal label, and the Connect With Us visual uses the approved user-supplied image optimized to approximately 50 KB WebP before upload. No section structure, routes, forms, Admin behavior, Auth/RLS, Supabase data, Cloudinary Work lifecycle, inquiry security, CSP/security headers, environment or deployment behavior is changed.\n`;
            fs.writeFileSync(baseline, text);
          }
          NODE

          git config user.name "rupantarhomes"
          git config user.email "rupantarhomes@gmail.com"
          git add .github/production-lock.json docs/PRODUCTION-BASELINE.md
          git diff --cached --check
          git commit -m "chore: refresh targeted production fingerprints [fingerprints]"
          git push
