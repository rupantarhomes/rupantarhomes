name: Hero micro copy

on:
  push:
    paths:
      - '.github/workflows/hero-micro-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact hero-only edits
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/rupantar/home-page.tsx')
          s = p.read_text(encoding='utf-8')
          old_pill = 'className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#FFF0F2] text-[#FF1A3D] text-[11px] font-semibold tracking-wide uppercase mt-2 sm:mt-0"'
          new_pill = 'className="inline-flex items-center gap-2 text-[#FF1A3D] text-[11px] font-semibold tracking-wide uppercase mt-2 sm:mt-0"'
          if s.count(old_pill) != 1:
              raise SystemExit(f'Expected exactly one Kathmandu pill class, found {s.count(old_pill)}')
          s = s.replace(old_pill, new_pill, 1)
          old_items = '["Site Visit", "3D Design", "Factory Finish"]'
          new_items = '["Site Visit", "Design Preview", "Factory Finish"]'
          if s.count(old_items) != 1:
              raise SystemExit(f'Expected exactly one hero feature array, found {s.count(old_items)}')
          s = s.replace(old_items, new_items, 1)
          p.write_text(s, encoding='utf-8', newline='')
      - name: Verify diff scope
        run: |
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "app/rupantar/home-page.tsx"
          git diff --check
          git diff -- app/rupantar/home-page.tsx
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rupantar/home-page.tsx
          git commit -m "Refine hero Kathmandu label"
          git push origin HEAD:main
