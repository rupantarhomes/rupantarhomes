name: Build routing release

on:
  push:
    branches:
      - chatgpt/dedicated-public-routes

permissions:
  contents: write

jobs:
  build-routing-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dedicated-public-routes
          fetch-depth: 0

      - name: Apply routing changes byte-safely
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_bytes().decode("utf-8")

          def write(path, text):
              Path(path).write_bytes(text.encode("utf-8"))

          def replace_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} replacement, got {count}")
              return updated

          # repository.ts: add one read-only work-by-slug loader without touching upload/save/delete code.
          path = "app/rupantar/repository.ts"
          text = read(path)
          marker = re.compile(r'(export type PublicWorksPage = \{ works: Work\[\]; total: number \};\r?\n\r?\n)')
          helper = '''export async function loadPublicWorkBySlug(category: string, slug: string): Promise<Work | null> {\n  if (!isSupabaseConfigured) {\n    return initialWorks.find((work) => work.category === category && work.slug === slug) ?? null;\n  }\n  const supabase = getSupabase();\n  const workResult = await supabase\n    .from("works")\n    .select("id,title,slug,category,location,short_description,long_description,featured")\n    .eq("category", category)\n    .eq("slug", slug)\n    .maybeSingle();\n  if (workResult.error) throw new Error(workResult.error.message);\n  if (!workResult.data) return null;\n  const row = workResult.data as WorkRow;\n  const imagesResult = await supabase\n    .from("work_images")\n    .select("id,work_id,secure_url,cloudinary_public_id,alt_text,sort_order,width,height,byte_size")\n    .eq("work_id", row.id)\n    .order("sort_order", { ascending: true });\n  if (imagesResult.error) throw new Error(imagesResult.error.message);\n  return mapWork(row, ((imagesResult.data ?? []) as WorkImageRow[]).map(mapImage));\n}\n\n'''
          text = replace_once(text, marker, lambda m: m.group(1) + helper, "repository helper")
          write(path, text)

          # site.tsx: import route helpers and the slug loader.
          path = "app/rupantar/site.tsx"
          text = read(path)
          text = replace_once(
              text,
              r'(\s+loadPublicContent,\r?\n\s+loadPublicWorksPage,\r?\n)',
              lambda m: m.group(1) + '  loadPublicWorkBySlug,\n',
              "repository import",
          )
          text = replace_once(
              text,
              r'(import \{ PublicFooter, PublicHeader, TopBar \} from "\./shared";\r?\n)',
              lambda m: m.group(1) + 'import { categoryPath, pagePath, parseRoute, workPath } from "./routes";\n',
              "route import",
          )

          # Add route synchronization immediately after loadWorks.
          load_works_pattern = re.compile(
              r'(  const loadWorks = async \(category: string, offset: number\) => \{.*?^  \};\r?\n)',
              re.M | re.S,
          )
          sync_block = '''\n  const applyBrowserRoute = useCallback(async () => {\n    const route = parseRoute(window.location.pathname);\n    if (route.kind === "home") {\n      setPage("home");\n      return;\n    }\n    if (route.kind === "about") {\n      setPage("about");\n      return;\n    }\n    if (route.kind === "admin") {\n      setPage("admin-login");\n      return;\n    }\n    if (route.kind === "works") {\n      setFilter(route.category);\n      setPage("works");\n      setWorksLoading(true);\n      try {\n        const result = await loadPublicWorksPage(0, 12, route.category);\n        setWorks(result.works);\n        setWorksTotal(result.total);\n      } finally {\n        setWorksLoading(false);\n      }\n      return;\n    }\n\n    setFilter(route.category);\n    const work = await loadPublicWorkBySlug(route.category, route.slug);\n    if (!work) {\n      setPage("works");\n      setWorksLoading(true);\n      try {\n        const result = await loadPublicWorksPage(0, 12, route.category);\n        setWorks(result.works);\n        setWorksTotal(result.total);\n      } finally {\n        setWorksLoading(false);\n      }\n      return;\n    }\n    setWorks((current) => [work, ...current.filter((item) => item.id !== work.id)]);\n    setSelectedWorkId(work.id);\n    setPage("work-detail");\n  }, []);\n'''
          text = replace_once(text, load_works_pattern, lambda m: m.group(1) + sync_block, "route synchronization block")

          # Replace the existing initialization effect with route-aware initialization + popstate.
          init_pattern = re.compile(
              r'  useEffect\(\(\) => \{\r?\n    document\.title = "Rupantar Homes";.*?^  \}, \[refreshAdminStats, refreshContent, refreshLeads\]\);',
              re.M | re.S,
          )
          init_replacement = '''  useEffect(() => {\n    document.title = "Rupantar Homes";\n    let active = true;\n\n    void refreshContent()\n      .then(() => {\n        if (active) void applyBrowserRoute();\n      })\n      .catch((error) => {\n        if (active) console.error("Unable to load website content", error);\n      });\n    void getCurrentAdminSession().then((session) => {\n      if (!active || !session) return;\n      setIsAdmin(true);\n      if (parseRoute(window.location.pathname).kind === "admin") setPage("admin-dashboard");\n      void Promise.all([refreshAdminStats(), refreshLeads()]);\n    });\n\n    const onPopState = () => void applyBrowserRoute();\n    window.addEventListener("popstate", onPopState);\n    return () => {\n      active = false;\n      window.removeEventListener("popstate", onPopState);\n    };\n  }, [applyBrowserRoute, refreshAdminStats, refreshContent, refreshLeads]);'''
          text = replace_once(text, init_pattern, init_replacement, "initialization effect")

          # Replace navigation/category/work handlers with URL-aware equivalents.
          nav_pattern = re.compile(
              r'  const navigate = \(nextPage: Page\) => \{.*?^  \};\r?\n\r?\n  const goToEstimate = \(\) => \{.*?^  \};\r?\n\r?\n  const openCategory = \(category: string\) => \{.*?^  \};\r?\n\r?\n  const openWork = \(id: string\) => \{.*?^  \};',
              re.M | re.S,
          )
          nav_replacement = '''  const pushPath = (path: string) => {\n    if (window.location.pathname !== path) window.history.pushState(null, "", path);\n  };\n\n  const navigate = (nextPage: Page) => {\n    if (nextPage.startsWith("admin-")) pushPath("/admin");\n    else pushPath(pagePath(nextPage));\n\n    if (nextPage.startsWith("admin-") && nextPage !== "admin-login" && !isAdmin) {\n      setPage("admin-login");\n    } else {\n      setPage(nextPage);\n      if (nextPage === "works") {\n        setFilter("all");\n        void loadWorks("all", 0);\n      }\n      if (nextPage.startsWith("admin-") && nextPage !== "admin-login") {\n        void refreshContent().catch((error) => console.error("Unable to refresh admin content", error));\n        void refreshLeads();\n        if (nextPage === "admin-dashboard") void refreshAdminStats();\n      }\n    }\n    window.scrollTo({ top: 0, behavior: "smooth" });\n  };\n\n  const goToEstimate = () => {\n    if (page !== "home") {\n      pushPath("/");\n      setPage("home");\n      window.setTimeout(\n        () => document.getElementById("estimate")?.scrollIntoView({ behavior: "smooth", block: "start" }),\n        150,\n      );\n      return;\n    }\n    document.getElementById("estimate")?.scrollIntoView({ behavior: "smooth", block: "start" });\n  };\n\n  const openCategory = (category: string) => {\n    pushPath(categoryPath(category));\n    setFilter(category);\n    setPage("works");\n    void loadWorks(category, 0);\n    window.scrollTo({ top: 0, behavior: "smooth" });\n  };\n\n  const openWork = (id: string) => {\n    const work = works.find((item) => item.id === id);\n    if (!work) return;\n    pushPath(workPath(work));\n    setSelectedWorkId(id);\n    setPage("work-detail");\n    window.scrollTo({ top: 0, behavior: "smooth" });\n  };'''
          text = replace_once(text, nav_pattern, nav_replacement, "navigation handlers")

          # Keep admin logout URL synchronized with the public home page.
          text = replace_once(
              text,
              r'(      setAdminStats\(\{ queries: 0, estimates: 0 \}\);\r?\n)(      setPage\("home"\);)',
              lambda m: m.group(1) + '      pushPath("/");\n' + m.group(2),
              "logout route",
          )

          # Category pills on Works should route, not only mutate local filter state.
          text = replace_once(
              text,
              r'setFilter=\{\(next\) => \{ setFilter\(next\); void loadWorks\(next, 0\); \}\}',
              'setFilter={openCategory}',
              "works category navigation",
          )
          write(path, text)

          # Add route-focused regression tests as source-level contract tests.
          Path("tests/routes.test.mjs").write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\nconst routes = await readFile(new URL("../app/rupantar/routes.ts", import.meta.url), "utf8");\nconst site = await readFile(new URL("../app/rupantar/site.tsx", import.meta.url), "utf8");\nconst repository = await readFile(new URL("../app/rupantar/repository.ts", import.meta.url), "utf8");\n\ntest("dedicated public route shapes are defined", () => {\n  for (const expected of ["/about", "/works", "/admin", "workPath", "categoryPath", "parseRoute"]) {\n    assert.ok(routes.includes(expected), `missing ${expected}`);\n  }\n});\n\ntest("browser navigation uses history and popstate", () => {\n  assert.match(site, /history\\.pushState/);\n  assert.match(site, /popstate/);\n  assert.match(site, /applyBrowserRoute/);\n});\n\ntest("work detail routes load by category and slug", () => {\n  assert.match(repository, /loadPublicWorkBySlug/);\n  assert.match(repository, /\\.eq\\("category", category\\)/);\n  assert.match(repository, /\\.eq\\("slug", slug\\)/);\n});\n''', encoding="utf-8", newline="\n")

      - name: Verify routing tests
        run: node --test tests/routes.test.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Production build
        run: npm run build

      - name: Commit routing implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rupantar/routes.ts app/rupantar/site.tsx app/rupantar/repository.ts tests/routes.test.mjs
          git diff --cached --check
          git commit -m "Add dedicated public routes"
          git push origin HEAD:chatgpt/dedicated-public-routes
