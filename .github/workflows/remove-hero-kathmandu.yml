name: Remove hero Kathmandu label

on:
  push:
    paths:
      - '.github/workflows/remove-hero-kathmandu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only hero Kathmandu label
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/rupantar/home-page.tsx')
          b = p.read_bytes()
          old = b'          <div className="inline-flex items-center gap-2 text-[#FF1A3D] text-[11px] font-semibold tracking-wide uppercase mt-2 sm:mt-0">\n            <Sparkles className="w-3.5 h-3.5" /> Kathmandu\n          </div>\n'
          count = b.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one hero Kathmandu block, found {count}')
          p.write_bytes(b.replace(old, b'', 1))
      - name: Verify exact scope
        run: |
          test "$(git diff --name-only)" = "app/rupantar/home-page.tsx"
          git diff --check
          git diff -- app/rupantar/home-page.tsx
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rupantar/home-page.tsx
          git commit -m "Remove hero Kathmandu label"
          git push origin HEAD:main
