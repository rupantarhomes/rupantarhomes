<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Transforming Spaces Inspiring Lives" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rupantar Homes" />
    <style>
      body { background: #ff1a3d; }
    </style>
    <link rel="icon" href="/assets/rupantar-favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://gmtdqeskyvdvyibccxwt.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="//gmtdqeskyvdvyibccxwt.supabase.co" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="//res.cloudinary.com" />
    <link rel="preload" as="image" href="/hero-real-1-mobile.webp" media="(max-width: 639px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-real-1-v2.webp" media="(min-width: 640px)" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Space+Grotesk:wght@600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin-work-actions.css" />
    <link rel="stylesheet" href="/admin-work-actions-v2.css" />
    <link rel="stylesheet" href="/work-gallery-final-polish-v2.css" />
    <title>Rupantar Homes</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var rupantarHomePreloads = {};
      function preloadRupantarHomeCovers(payload) {
        if (!payload || !Array.isArray(payload.works)) return payload;
        payload.works.forEach(function (work) {
          var image = work && Array.isArray(work.images) ? work.images[0] : null;
          if (!image || typeof image.url !== "string" || image.url.indexOf("https://res.cloudinary.com/") !== 0) return;
          var delivery = function (width) { return image.url.replace("/image/upload/", "/image/upload/c_limit,w_" + width + "/f_auto/q_auto:good/"); };
          if (rupantarHomePreloads[image.url]) return;
          rupantarHomePreloads[image.url] = true;
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.fetchPriority = "low";
          link.href = delivery(480);
          link.setAttribute("imagesrcset", [160, 320, 480, 768].map(function (width) { return delivery(width) + " " + width + "w"; }).join(", "));
          link.setAttribute("imagesizes", "(min-width: 1024px) 33vw, (min-width: 640px) 50vw, 33vw");
          document.head.appendChild(link);
        });
        return payload;
      }
      function directRupantarHomeBootstrap() {
        var supabaseUrl = "%VITE_SUPABASE_URL%";
        var supabaseKey = "%VITE_SUPABASE_PUBLISHABLE_KEY%";
        if (supabaseUrl.indexOf("https://") !== 0 || supabaseUrl.indexOf("%VITE_") !== -1 || !supabaseKey || supabaseKey.indexOf("%VITE_") !== -1) {
          throw new Error("Home bootstrap configuration unavailable");
        }
        var headers = { Accept: "application/json", apikey: supabaseKey };
        var worksSelect = "id,title,slug,category,location,short_description,long_description,featured,blog_url,work_images(id,work_id,secure_url,cloudinary_public_id,alt_text,sort_order,width,height,byte_size)";
        var urls = [
          supabaseUrl + "/rest/v1/works?select=" + encodeURIComponent(worksSelect) + "&order=created_at.desc&work_images.order=sort_order.asc&limit=6",
          supabaseUrl + "/rest/v1/reviews?select=id,name,location,message,rating,instagram_url&order=created_at.desc",
          supabaseUrl + "/rest/v1/site_settings?select=slogan,phone,instagram_url,tiktok_url,address,workshop_note&id=eq.1&limit=1"
        ];
        return Promise.all(urls.map(function (url) {
          return fetch(url, { headers: headers }).then(function (response) {
            if (!response.ok) throw new Error("Direct Home bootstrap unavailable");
            return response.json();
          });
        })).then(function (results) {
          var settings = results[2] && results[2][0];
          if (!Array.isArray(results[0]) || !Array.isArray(results[1]) || !settings) throw new Error("Direct Home bootstrap invalid");
          var number = function (value) { return typeof value === "number" && isFinite(value) ? value : undefined; };
          var works = results[0].map(function (work) {
            return {
              id: String(work.id == null ? "" : work.id), title: String(work.title || ""), slug: String(work.slug || ""),
              category: String(work.category || ""), location: String(work.location || ""), shortDesc: String(work.short_description || ""),
              longDesc: String(work.long_description || ""), featured: work.featured === true, blogUrl: work.blog_url || undefined,
              images: (Array.isArray(work.work_images) ? work.work_images : []).map(function (image) {
                return { id: String(image.id == null ? "" : image.id), workId: String(image.work_id == null ? "" : image.work_id),
                  url: String(image.secure_url || ""), publicId: String(image.cloudinary_public_id || ""), altText: String(image.alt_text || ""),
                  sortOrder: number(image.sort_order) || 0, width: number(image.width), height: number(image.height), bytes: number(image.byte_size) };
              }).sort(function (left, right) { return left.sortOrder - right.sortOrder; })
            };
          });
          var reviews = results[1].map(function (review) {
            return { id: String(review.id == null ? "" : review.id), name: String(review.name || ""), location: String(review.location || ""),
              message: String(review.message || ""), rating: number(review.rating) || 5, instagramLink: review.instagram_url || undefined };
          });
          return { works: works, reviews: reviews, settings: { slogan: String(settings.slogan || ""), phone: String(settings.phone || ""),
            instagram: String(settings.instagram_url || ""), tiktok: String(settings.tiktok_url || ""), address: String(settings.address || ""),
            workshopNote: String(settings.workshop_note || "") }, confirmedAt: Date.now() };
        });
      }
      if (window.location.pathname === "/") {
        try {
          var storedHome = JSON.parse(window.localStorage.getItem("rupantar-home-bootstrap-v1") || "null");
          if (storedHome && Date.now() - storedHome.confirmedAt <= 86400000) preloadRupantarHomeCovers(storedHome);
        } catch (error) {}
        window.__RUPANTAR_HOME_BOOTSTRAP__ = fetch("/api/public-home", { headers: { Accept: "application/json" } })
        .then(function (response) { if (!response.ok) throw new Error("Home bootstrap unavailable"); return response.json(); })
        .catch(directRupantarHomeBootstrap)
        .then(preloadRupantarHomeCovers);
        window.__RUPANTAR_HOME_BOOTSTRAP__.catch(function () {});
      }
    </script>
    <script type="module" src="/app/navigation-precision.ts"></script>
    <script type="module" src="/app/public-performance.ts"></script>
    <script type="module" src="/app/admin-mobile-lock.ts"></script>
    <script type="module" src="/app/footer-admin-link.ts"></script>
    <script type="module" src="/app/client-entry.tsx"></script>
  </body>
</html>
