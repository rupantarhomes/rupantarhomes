     card.classList.add('tilt-card');
     card.addEventListener('mousemove',e=>{
       const r=card.getBoundingClientRect();const x=e.clientX-r.left-r.width/2;const y=e.clientY-r.top-r.height/2;
       card.style.transform=`perspective(900px) rotateX(${(-y/20)}deg) rotateY(${x/20}deg) translateY(-4px)`;
     });
     card.addEventListener('mouseleave',()=>{card.style.transform='perspective(900px) rotateX(0) rotateY(0)';});
   });
  }catch(e){console.log(e)}
 }
 setTimeout(initPremium,900);
})();
</script>


<style>
#morph-word{
  display:inline-block;
  min-width:95px;
  will-change:transform,opacity,filter;
  transition: transform 0.55s cubic-bezier(0.23,1,0.32,1), opacity 0.4s ease, filter 0.55s ease;
}
.morph-out{
  transform:translateY(-18px);
  opacity:0;
  filter:blur(6px);
}
.morph-in{
  transform:translateY(0);
  opacity:1;
  filter:blur(0);
}
</style>
<script>
(function(){
  const words=["Spaces","Kitchens","Wardrobes","Ceilings","Homes","Interiors"];
  let idx=0;
  function cycle(){
    const el=document.getElementById('morph-word');
    if(!el) return;
    el.classList.add('morph-out');
    el.classList.remove('morph-in');
    setTimeout(()=>{
      idx=(idx+1)%words.length;
      el.textContent=words[idx];
      el.classList.remove('morph-out');
      el.classList.add('morph-in');
    },320);
  }
  setTimeout(()=>{
    const el=document.getElementById('morph-word');
    if(el) el.classList.add('morph-in');
    setInterval(cycle,2500);
  },900);
})();
</script>
